name: Release VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag, for example v0.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        id: package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VSIX_NAME="like-obsidian-${VERSION}.vsix"
          npx vsce package --no-dependencies --out "${VSIX_NAME}"
          echo "vsix=${VSIX_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag_name }}" >> "${GITHUB_OUTPUT}"
          else
            echo "name=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
          VSIX_PATH: ${{ steps.package.outputs.vsix }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${VSIX_PATH}" --clobber
          else
            gh release create "${TAG_NAME}" "${VSIX_PATH}" \
              --title "${TAG_NAME}" \
              --notes "VSIX package for ${TAG_NAME}."
          fi
